name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Light install: the tests do not download embedding models or call the Gemini API
      - run: pip install langchain-core langchain-text-splitters langchain-chroma chromadb pypdf python-dotenv pytest
      - run: pytest -q
